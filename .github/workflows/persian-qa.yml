name: Persian pen and typography QA
on:
  pull_request:
    paths:
      - "skills/anidoodle/engine/**"
      - "plugins/anidoodle/skills/anidoodle/engine/**"
      - ".github/workflows/persian-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persian-pen:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: skills/anidoodle/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/anidoodle/engine/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
      - name: Verify authentic Persian pen animation and connected glyphs
        run: node tools/persian-qa.mjs
      - name: Publish handwriting-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persian-pen-qa
          path: |
            skills/anidoodle/engine/out/persian-gallery-contact.jpg
            skills/anidoodle/engine/out/persian-showcase-contact.jpg
            skills/anidoodle/engine/out/persian-showcase.mp4
            skills/anidoodle/engine/out/persian-qa/*.png
          if-no-files-found: warn
