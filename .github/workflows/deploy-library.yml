name: Publish Persian Motion Library
on:
  push:
    branches: [main]
    paths:
      - "library/**"
      - "skills/anidoodle/engine/assets/fonts/**"
      - ".github/workflows/deploy-library.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build a source-first public catalog with NO generated demo media
        run: |
          mkdir -p _site/library _site/skills/anidoodle/engine/assets
          cp -a library/. _site/library/
          cp -a skills/anidoodle/engine/assets/fonts _site/skills/anidoodle/engine/assets/fonts
          printf '%s\n' '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>کتابخانه پرشین‌دودل</title><meta http-equiv="refresh" content="0;url=./library/"></head><body><a href="./library/">ورود به کتابخانه</a></body></html>' > _site/index.html
          touch _site/.nojekyll
          test -s _site/library/data/catalog.json
          test -s _site/library/data/source-audio.json
          test -s _site/library/index.html
          test -s _site/skills/anidoodle/engine/assets/fonts/Vazirmatn-Variable.ttf
          test ! -d _site/assets/audio
          test ! -d _site/assets/library
          du -sh _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
