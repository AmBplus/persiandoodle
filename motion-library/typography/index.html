<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمایش متن فارسی | کتابخانهٔ موشن</title>
<style>
  @font-face {
    font-family: "Vazirmatn";
    src: url("Vazirmatn-Variable.ttf") format("truetype");
    font-weight: 100 900;
  }
  html, body { margin: 0; background: #0b0f16; color: #e8ecf2; font-family: system-ui, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 12px; background: #111827; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button {
    background: #1d2838; color: #e8ecf2; border: 1px solid #2d3b52;
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font: inherit;
  }
  button.on { background: #ffb547; color: #111827; border-color: #ffb547; }
  input[type=range] { flex: 1; min-width: 200px; }
  .scenes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .note { color: #8a97ab; font-size: 13px; margin-top: 12px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1280" height="720"></canvas>

  <div class="bar">
    <button id="play">توقف</button>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
    <span id="clock">0.0s</span>
  </div>

  <div class="scenes" id="scenes"></div>

  <p class="note">
    هر صحنه یک روش نمایش متن را نشان می‌دهد. متن کامل فارسی یک‌بار شکل‌دهی می‌شود و هیچ حرفی جدا کشیده نمی‌شود،
    بنابراین پیوستگی حروف حفظ می‌ماند. برای هر حالت، «کلمه» یا «خط» واحد حرکت است، نه حرف.
  </p>
</div>

<script>
(() => {
  const W = 1280, H = 720;
  const TEXT = "می‌توانیم روی طرح‌ها کار کنیم";
  const WORDS = TEXT.split(" ");
  const SIZE = 88;
  const COLOR = "#f2f5fa";
  const ACCENT = "#ffb547";
  const MUTED = "#4a5873";
  const SCENE_DUR = 3.6;   // seconds per scene
  const ANIM = 2.4;        // animation portion of each scene

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cx = W / 2, cy = H / 2;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeBack = t => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const toFa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

  function setFont() {
    ctx.font = `${SIZE}px Vazirmatn`;
    ctx.direction = "rtl";
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "center";
  }

  // Layout helpers: compute each word's centre, laid out right-to-left.
  function wordLayout() {
    setFont();
    const widths = WORDS.map(w => ctx.measureText(w).width);
    const space = ctx.measureText(" ").width;
    const total = widths.reduce((a, b) => a + b, 0) + space * (WORDS.length - 1);
    let xRight = cx + total / 2;
    return WORDS.map((w, i) => {
      const centre = xRight - widths[i] / 2;
      xRight -= widths[i] + space;
      return { word: w, x: centre, width: widths[i] };
    });
  }

  function fullWidth() {
    setFont();
    return ctx.measureText(TEXT).width;
  }

  const baseline = cy + SIZE * 0.35;

  // ---------- Scenes: each receives local progress t in [0,1] ----------

  // 1) Reveal from the right edge (start of RTL reading), with cursor.
  function sceneReveal(t) {
    const p = easeOut(t);
    const tw = fullWidth();
    const right = cx + tw / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(right - tw * p, 0, tw * p + 1, H);
    ctx.clip();
    setFont();
    ctx.fillStyle = COLOR;
    ctx.fillText(TEXT, cx, baseline);
    ctx.restore();
    if (p < 1) {
      ctx.fillStyle = ACCENT;
      ctx.fillRect(right - tw * p - 3, baseline - SIZE * 0.85, 4, SIZE * 1.1);
    }
  }

  // 2) Line rises out of a mask (text slides up, clipped by a moving window).
  function sceneMaskRise(t) {
    const e = easeOut(t);
    const off = (1 - e) * 70;
    const top = baseline + SIZE * 0.35 - SIZE * 1.6 * e;
    const bottom = baseline + SIZE * 0.35;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, top, W, bottom - top);
    ctx.clip();
    setFont();
    ctx.fillStyle = COLOR;
    ctx.fillText(TEXT, cx, baseline + off);
    ctx.restore();
  }

  // 3) Word by word fade and slide.
  function sceneWordFade(t) {
    const layout = wordLayout();
    const n = layout.length;
    setFont();
    ctx.fillStyle = COLOR;
    layout.forEach((item, i) => {
      const s = (i / n) * 0.55;
      const k = easeOut(seg(t, s, s + 0.45));
      if (k <= 0) return;
      ctx.globalAlpha = k;
      ctx.fillText(item.word, item.x, baseline + (1 - k) * 40);
    });
    ctx.globalAlpha = 1;
  }

  // 4) Word pop with overshoot scale.
  function sceneWordPop(t) {
    const layout = wordLayout();
    const n = layout.length;
    setFont();
    ctx.fillStyle = COLOR;
    layout.forEach((item, i) => {
      const s = (i / n) * 0.6;
      const k = easeBack(seg(t, s, s + 0.4));
      if (k <= 0) return;
      ctx.save();
      ctx.translate(item.x, baseline);
      ctx.scale(k, k);
      ctx.globalAlpha = clamp(k);
      ctx.fillText(item.word, 0, 0);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  // 5) Highlight sweep: muted text, then accent colour sweeps from the right.
  function sceneHighlight(t) {
    const p = easeOut(t);
    const tw = fullWidth();
    const right = cx + tw / 2;
    setFont();
    ctx.fillStyle = MUTED;
    ctx.fillText(TEXT, cx, baseline);
    ctx.save();
    ctx.beginPath();
    ctx.rect(right - tw * p, 0, tw * p + 1, H);
    ctx.clip();
    ctx.fillStyle = ACCENT;
    ctx.fillText(TEXT, cx, baseline);
    ctx.restore();
  }

  // 6) Counter: numbers counting up in Persian digits, with a progress bar.
  function sceneCounter(t) {
    const e = easeOut(t);
    const value = Math.round(e * 1405);
    setFont();
    ctx.font = `${SIZE * 1.6}px Vazirmatn`;
    ctx.fillStyle = ACCENT;
    ctx.fillText(toFa(value), cx, cy + SIZE * 0.5);
    const barW = 520;
    ctx.fillStyle = MUTED;
    ctx.fillRect(cx - barW / 2, cy + SIZE * 1.1, barW, 8);
    ctx.fillStyle = ACCENT;
    ctx.fillRect(cx + barW / 2 - barW * e, cy + SIZE * 1.1, barW * e, 8);
  }

  const SCENES = [
    { name: "بازشدن از راست", fn: sceneReveal },
    { name: "بالا آمدن با ماسک", fn: sceneMaskRise },
    { name: "محو کلمه‌به‌کلمه", fn: sceneWordFade },
    { name: "پاپ کلمات", fn: sceneWordPop },
    { name: "هایلایت", fn: sceneHighlight },
    { name: "شمارنده", fn: sceneCounter },
  ];
  const TOTAL = SCENES.length * SCENE_DUR;

  // ---------- Timeline and controls ----------

  const state = { time: 0, playing: true };
  const playBtn = document.getElementById("play");
  const scrub = document.getElementById("scrub");
  const clock = document.getElementById("clock");
  const sceneBox = document.getElementById("scenes");

  SCENES.forEach((s, i) => {
    const b = document.createElement("button");
    b.textContent = s.name;
    b.onclick = () => { state.time = i * SCENE_DUR; state.playing = true; };
    b.dataset.index = i;
    sceneBox.appendChild(b);
  });

  playBtn.onclick = () => {
    state.playing = !state.playing;
    playBtn.textContent = state.playing ? "توقف" : "پخش";
  };

  scrub.oninput = () => {
    state.time = Number(scrub.value) * TOTAL;
    state.playing = false;
    playBtn.textContent = "پخش";
  };

  function draw(time) {
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, W, H);

    const idx = Math.min(SCENES.length - 1, Math.floor(time / SCENE_DUR));
    const local = time - idx * SCENE_DUR;
    const t = clamp(local / ANIM);

    SCENES[idx].fn(t);

    [...sceneBox.children].forEach((b, i) => b.classList.toggle("on", i === idx));
    scrub.value = time / TOTAL;
    clock.textContent = time.toFixed(1) + "s";
  }

  let last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000;
    last = now;
    if (state.playing) state.time = (state.time + dt) % TOTAL;
    draw(state.time);
    requestAnimationFrame(frame);
  }

  // Wait for the font so the first frame is shaped correctly.
  const ready = document.fonts && document.fonts.load
    ? document.fonts.load(`${SIZE}px Vazirmatn`, TEXT).catch(() => {})
    : Promise.resolve();
  ready.then(() => requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); }));
})();
</script>
</body>
</html>
